name: Deploy web prototype to GitHub Pages

# Publishes the static prototype in web/ to GitHub Pages so it can be played
# on any device (including mobile). No build step — it's plain HTML/JS/CSS.

on:
  push:
    branches:
      - main
      - claude/puzzle-game-planning-9CrGj
  workflow_dispatch: {}

# Allow only one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ as the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
